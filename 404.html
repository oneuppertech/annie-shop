
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var currentPath = window.location.pathname;
        var redirect =
          currentPath +
          window.location.search +
          window.location.hash;

        window.location.replace(
          window.location.origin +
          '/?/' +
          redirect.replace(/^\//, '')
        );
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
