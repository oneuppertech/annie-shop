<script>
  (function () {
    var search = window.location.search;

    if (search.startsWith('?/')) {
      var route = search
        .slice(2)
        .replace(/~and~/g, '&');

      window.history.replaceState(
        null,
        '',
        '/' + route + window.location.hash
      );
    }
  })();
</script>
